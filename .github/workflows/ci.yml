name: CI - Tests & Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests and generate report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pytest and generate HTML report
        run: |
          PYTHONPATH=. python -m pytest --html=reports/test_report.html --self-contained-html -q

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/test_report.html

      - name: Upload Pages artifact (reports/)
        if: always()
        uses: actions/upload-pages-artifact@v1
        with:
          path: reports

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Pages
        uses: actions/deploy-pages@v1
